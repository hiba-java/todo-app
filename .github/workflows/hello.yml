name: Hello CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dire-bonjour:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Dire bonjour
        run: echo "Bonjour depuis GitHub Actions !"
     
      - name: Récupérer la liste des fichiers
        run: ls -la

      - name: Python version
        run: python3 --version